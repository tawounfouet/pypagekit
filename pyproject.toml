[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypagekit"
dynamic = ["version"]
description = "Python-first framework for structured page composition and static site generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.27.2,<0.28",
  "rich>=15.0.0,<16",
]
keywords = ["python", "html", "static-site", "components", "web"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tawounfouet/pypagekit"
Repository = "https://github.com/tawounfouet/pypagekit"
Issues = "https://github.com/tawounfouet/pypagekit/issues"
Changelog = "https://github.com/tawounfouet/pypagekit/blob/main/CHANGELOG.md"

[project.scripts]
pypagekit = "pypagekit.cli.app:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.setuptools.dynamic]
version = {attr = "pypagekit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypagekit = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/pypagekit"]
