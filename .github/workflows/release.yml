name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify tagged distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release tooling
        run: python -m pip install -U pip build

      - name: Verify stable tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          from pypagekit import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(
                  f"Release tag must be stable SemVer vX.Y.Z, got {tag!r}."
              )

          expected = f"v{__version__}"
          if tag != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {__version__!r}; "
                  f"expected {expected!r}."
              )
          PY

      - name: Build distributions
        run: python -m build

      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify installed distribution
        run: |
          python - <<'PY'
          from importlib import metadata, resources
          import os

          import pypagekit

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          distribution = metadata.distribution("pypagekit")

          assert pypagekit.__version__ == tag_version
          assert distribution.version == tag_version
          assert distribution.metadata["Requires-Python"] == ">=3.11"
          assert "Development Status :: 5 - Production/Stable" in distribution.metadata.get_all(
              "Classifier"
          )
          assert resources.files("pypagekit").joinpath("py.typed").is_file()
          PY
          python -m pip check

      - name: Smoke test installed CLI
        run: |
          pypagekit --version
          pypagekit --help
          python -m pypagekit --version

      - name: Smoke test generated project
        run: |
          project_root="$(mktemp -d)/release-smoke"
          pypagekit new "$project_root"
          (
            cd "$project_root"
            python site.py
            test -f dist/index.html
            pypagekit doctor
            pypagekit inspect
          )

      - name: Upload qualified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag"               --verify-tag               --title "PyPageKit $version"               --generate-notes
          fi

          gh release upload "$tag" dist/* --clobber

  pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pypagekit/
    permissions:
      id-token: write

    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
