schema_version = 1
package_version = "1.1.0b2"

[classifications]
stable = "Stable public Python surface covered by the current PyPageKit major-version compatibility contract."
provisional_public = "Explicitly public today, but still eligible for refinement during the 0.9 freeze cycle."
operational_contract = "User-visible non-import contract such as CLI commands, exit semantics, or plugin metadata names."
internal = "Importable implementation detail with no compatibility promise."

