name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

  package:
    name: Release package qualification
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install -U pip build

      - name: Build distributions
        run: python -m build

      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify installed wheel metadata
        run: |
          python - <<'PY'
          from importlib import metadata, resources

          import pypagekit

          distribution = metadata.distribution("pypagekit")
          assert distribution.version == pypagekit.__version__
          assert distribution.metadata["Requires-Python"] == ">=3.11"
          assert "Development Status :: 5 - Production/Stable" in distribution.metadata.get_all(
              "Classifier"
          )
          assert resources.files("pypagekit").joinpath("py.typed").is_file()
          PY
          python -m pip check

      - name: Generate 1.1 contract snapshot candidate
        run: python tools/api_contract_snapshot.py > API_CONTRACT_1_1.generated.json

      - name: Upload 1.1 contract snapshot candidate
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-1-1-candidate
          path: API_CONTRACT_1_1.generated.json
          if-no-files-found: error

      - name: Bootstrap canonical 1.1 snapshot onto PR branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF:$HEAD_REF"
          git checkout "$HEAD_REF"
          if test -f API_CONTRACT_1_1.json; then
            echo "API_CONTRACT_1_1.json already exists; bootstrap push not required."
            exit 0
          fi
          python tools/api_contract_snapshot.py > API_CONTRACT_1_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add API_CONTRACT_1_1.json
          git commit -m "[LOT-43] Add canonical 1.1 contract snapshot"
          git push origin "HEAD:$HEAD_REF"

      - name: Smoke test installed CLI
        run: |
          pypagekit --version
          pypagekit --help
          pypagekit new --help
          pypagekit serve --help
          pypagekit doctor --help
          pypagekit inspect --help
          python -m pypagekit --version
          python -m pypagekit --help

      - name: Smoke test generated project
        run: |
          project_root="$(mktemp -d)/release-smoke"
          pypagekit new "$project_root"
          python - "$project_root" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          from pypagekit.project import pypagekit_requirement

          pyproject = Path(sys.argv[1]) / "pyproject.toml"
          with pyproject.open("rb") as stream:
              project = tomllib.load(stream)["project"]

          assert project["dependencies"] == [pypagekit_requirement()]
          PY
          (
            cd "$project_root"
            python site.py
            test -f dist/index.html
            pypagekit doctor
            pypagekit inspect
          )

      - name: Install and smoke test source distribution
        run: |
          python -m venv /tmp/pypagekit-sdist
          /tmp/pypagekit-sdist/bin/python -m pip install -U pip
          /tmp/pypagekit-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/pypagekit-sdist/bin/python - <<'PY'
          from importlib import metadata
          import pypagekit

          assert metadata.version("pypagekit") == pypagekit.__version__
          PY
          /tmp/pypagekit-sdist/bin/pypagekit --version
