[[modules]]
name = "pypagekit.cli"
classification = "provisional_public"
exports = [
  "app",
  "main",
]

[cli]
classification = "operational_contract"
console_script = "pypagekit"
module_entry = "python -m pypagekit"
commands = [
  "doctor",
  "inspect",
  "new",
  "serve",
]
root_options = [
  "--help",
  "--version",
]
success_exit_code = 0
execution_error_exit_code = 1
usage_error_exit_code = 2

[extensions]
classification = "operational_contract"
api_version = "0.7"
renderer_entry_point_group = "pypagekit.renderers"
build_planner_entry_point_group = "pypagekit.build_planners"
component_entry_point_group = "pypagekit.components"
builtin_renderer_id = "pypagekit.renderer.html"
builtin_build_planner_id = "pypagekit.build.planner"
builtin_components_id = "pypagekit.components.builtin"

[typing]
classification = "operational_contract"
py_typed = true
minimum_python = "3.11"

[internal_policy]
classification = "internal"
rule = "Any pypagekit module or symbol not listed above as a public facade/export or operational contract is internal unless a later compatibility document explicitly promotes it."
examples = [
  "pypagekit._deprecation",
  "pypagekit._filesystem_transaction",
  "pypagekit.build.model",
  "pypagekit.components.registry",
  "pypagekit.domain.route",
  "pypagekit.extensions.registry",
  "pypagekit.rendering.serializer",
  "pypagekit.cli.commands",
]
